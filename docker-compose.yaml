# ─────────────────────────────────────────────────────────────────────────────
# TenderMatch — Docker Compose
#
# IMPORTANT: Never put real secrets directly in this file.
# Copy backend/.env.example → backend/.env and fill in real values.
# All services load secrets via the env_file directive.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  redis:
    image: redis:7.2-alpine
    container_name: tendermatch_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongodb:
    image: mongo:6.0
    container_name: tendermatch_mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Phase 2: PostgreSQL with pgvector ───────────────────────────────────────
  # pgvector/pgvector:pg16 has the pgvector extension pre-compiled.
  # The init script enables the extension and creates the vector-ready schema.

  postgres:
    image: pgvector/pgvector:pg16
    container_name: tendermatch_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"    # Non-default host port avoids conflicts with local PG
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tendermatch}
      POSTGRES_USER: ${POSTGRES_USER:-tendermatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_pgvector.sql:/docker-entrypoint-initdb.d/01_pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tendermatch} -d ${POSTGRES_DB:-tendermatch}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Application ─────────────────────────────────────────────────────────────

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tendermatch_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_URI=postgresql+asyncpg://${POSTGRES_USER:-tendermatch}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-tendermatch}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - faiss_data:/app/faiss_store
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Celery Worker ────────────────────────────────────────────────────────────
  # Handles: document processing, email notifications, embedding generation

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tendermatch_celery_worker
    restart: unless-stopped
    command: [
      "celery", "-A", "app.core.celery_app", "worker",
      "--pool=prefork", "--concurrency=4", "--loglevel=info",
      "--queues=default"
    ]
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_URI=postgresql+asyncpg://${POSTGRES_USER:-tendermatch}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-tendermatch}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - faiss_data:/app/faiss_store

  # ── Celery Beat ──────────────────────────────────────────────────────────────
  # Runs scheduled tasks (e.g. hourly scraper, daily re-matching, cleanup)
  # Must be a SINGLE instance — never scale this service horizontally.

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tendermatch_celery_beat
    restart: unless-stopped
    command: [
      "celery", "-A", "app.core.celery_app", "beat",
      "--loglevel=info",
      "--schedule=/tmp/celerybeat-schedule"
    ]
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_URI=postgresql+asyncpg://${POSTGRES_USER:-tendermatch}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-tendermatch}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ── Celery Flower (Task Monitor) ─────────────────────────────────────────────
  # Optional: comment out in production if not needed
  # Access at http://localhost:5555

  celery_flower:
    image: mher/flower:2.0
    container_name: tendermatch_flower
    restart: unless-stopped
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - FLOWER_BASIC_AUTH=admin:changeme   # Change this password!
    depends_on:
      - redis
    profiles:
      - monitoring   # Only starts when: docker compose --profile monitoring up

# ── Named Volumes ──────────────────────────────────────────────────────────────

volumes:
  redis_data:
    driver: local
  mongo_data:
    driver: local
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  faiss_data:
    driver: local
