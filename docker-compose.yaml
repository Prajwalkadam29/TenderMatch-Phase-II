services:
  redis:
    image: redis:7.2-alpine
    container_name: tendermatch_redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  mongodb:
    image: mongo:6.0
    container_name: tendermatch_mongodb
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tendermatch_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - DATABASE_NAME=tendermatch
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=supersecretjwtkeyforproductiontendermatch
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tendermatch_celery_worker
    restart: always
    command: ["celery", "-A", "app.core.celery_app", "worker", "--pool=solo", "--loglevel=info"]
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - DATABASE_NAME=tendermatch
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

volumes:
  redis_data:
    driver: local
  mongo_data:
    driver: local
  uploads_data:
    driver: local
