[alembic]
# Path to migrations directory (relative to this file)
script_location = alembic

# Jinja2 templating in migration files
prepend_sys_path = .

# Timezone for generated revision timestamps
timezone = UTC

# Max line length for generated files
line_length = 100

# Template for revision file naming: <rev>_<slug>.py
# The slug comes from the --message flag when running alembic revision
file_template = %%(rev)s_%%(slug)s

# The SQLAlchemy database URL is read from the environment,
# NOT hardcoded here. See alembic/env.py for the logic.
# sqlalchemy.url is intentionally left blank.
sqlalchemy.url =

[post_write_hooks]
# Optional: run black formatter on newly generated migration files
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100

[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
